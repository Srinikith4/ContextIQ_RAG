<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ContextIQ</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='black'/><text x='16' y='23' font-size='20' text-anchor='middle' fill='white' font-family='Georgia,serif'>C</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  /* ---------- colour tokens: black and white only ---------- */
  :root {
    --page: #ececec; --sheet: #fbfbfb; --text: #000000; --muted: #6a6a6a;
    --line: #d6d6d6; --soft: #f1f1f1; --ink: #000000; --on-ink: #ffffff;
    --sans: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
    --serif: "Instrument Serif", "Iowan Old Style", Georgia, "Times New Roman", serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #000000; --sheet: #121212; --text: #f4f4f4; --muted: #9a9a9a;
      --line: #2b2b2b; --soft: #1b1b1b; --ink: #f4f4f4; --on-ink: #000000;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --page: #000000; --sheet: #121212; --text: #f4f4f4; --muted: #9a9a9a;
    --line: #2b2b2b; --soft: #1b1b1b; --ink: #f4f4f4; --on-ink: #000000;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--page); color: var(--text);
    font: 400 16px/1.5 var(--sans); -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; height: 100vh; height: 100dvh;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { cursor: default; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  svg { display: block; }

  /* ---------- top bar ---------- */
  .top { display: flex; align-items: center; justify-content: space-between; padding: 18px 28px 0; }
  .brand { margin: 0; font: 400 34px/1 var(--serif); letter-spacing: -0.01em; }
  .icon-btn {
    width: 40px; height: 40px; display: grid; place-items: center;
    border: 1px solid var(--line); border-radius: 9px; background: none;
  }
  .icon-btn:hover { border-color: var(--ink); }

  /* ---------- folder tabs ---------- */
  .tabs {
    display: flex; align-items: flex-end; gap: 4px; padding: 20px 28px 0;
    overflow-x: auto; scrollbar-width: none; position: relative; z-index: 1; margin-bottom: -1px;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: none; display: flex; align-items: center; height: 48px; max-width: 300px;
    border: 1px solid var(--line); border-radius: 11px 11px 0 0; color: var(--muted);
  }
  .tab:hover { color: var(--text); }
  .tab.active { background: var(--sheet); color: var(--text); border-bottom-color: var(--sheet); }
  .tab-label {
    height: 100%; padding: 0 18px; border: 0; background: none; color: inherit;
    font: 500 15px/1 var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    display: flex; align-items: center; gap: 9px; border-radius: 11px 11px 0 0;
  }
  .tab.active .tab-label { font-weight: 600; }
  .tab.closable .tab-label { padding-right: 8px; }
  .tab-close {
    flex: none; width: 28px; height: 28px; margin-right: 8px; display: grid; place-items: center;
    border: 0; border-radius: 7px; background: none; color: inherit;
  }
  .tab-close:hover { background: var(--soft); }
  .tab.add { border-style: dashed; }
  .tab.add.locked { opacity: .4; }
  .tab.add.locked .tab-label { cursor: not-allowed; }

  /* ---------- the open sheet ---------- */
  .sheet {
    flex: 1; min-height: 0; margin: 0 28px 28px; background: var(--sheet);
    border: 1px solid var(--line); border-radius: 0 14px 14px 14px; overflow: hidden;
    display: grid; grid-template-columns: minmax(0, 1fr) 310px;
  }
  .main { min-height: 0; display: flex; flex-direction: column; }
  .head {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px;
    padding: 22px 36px; border-bottom: 1px solid var(--line);
  }
  .title { margin: 0; font: 600 24px/1.2 var(--sans); letter-spacing: -0.02em; overflow-wrap: anywhere; }
  .modes { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 10px; background: var(--page); }
  .modes button {
    display: flex; align-items: center; gap: 8px; padding: 8px 16px; border: 0; border-radius: 7px;
    background: none; color: var(--muted); font: 500 14px/1 var(--sans);
  }
  .modes button:hover { color: var(--text); }
  .modes button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
  .scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 34px 36px 18px; }
  .col { max-width: 820px; }

  /* ---------- buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 20px;
    border: 1px solid var(--ink); border-radius: 9px; background: var(--ink); color: var(--on-ink);
    font: 600 15px/1 var(--sans);
  }
  .btn:disabled { opacity: .45; }
  .btn.ghost { background: none; color: var(--text); border-color: var(--line); }
  .btn.ghost:hover { border-color: var(--ink); }
  .text-btn { border: 0; background: none; padding: 4px 0; color: var(--muted); font: 500 13px/1 var(--sans); }
  .text-btn:hover { color: var(--text); text-decoration: underline; text-underline-offset: 3px; }

  /* ---------- ask ---------- */
  .welcome h2, .display { margin: 0 0 12px; font: 600 clamp(28px, 2.8vw, 36px)/1.15 var(--sans); letter-spacing: -0.03em; }
  .lead { margin: 0; max-width: 60ch; color: var(--muted); font-size: 16.5px; line-height: 1.6; }

  .turn { margin-bottom: 44px; }
  .q { margin: 0 0 18px; font: 600 clamp(19px, 1.8vw, 22px)/1.35 var(--sans); letter-spacing: -0.015em; overflow-wrap: anywhere; }
  .a { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 26px; }
  .page { align-self: start; padding-top: 10px; border-top: 2px solid var(--ink); min-height: 44px; }
  .page.none { border-top-color: transparent; }
  .page .num { display: block; font: 600 48px/0.95 var(--sans); letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
  .page .lbl { display: block; margin-top: 6px; color: var(--muted); font: 500 12.5px/1.4 var(--sans); }
  .a-body { padding-top: 10px; font: 400 16.5px/1.75 var(--sans); white-space: pre-wrap; overflow-wrap: anywhere; }
  .a-tools { margin-top: 12px; }
  .err { border-left: 3px solid var(--ink); padding-left: 14px; }
  .thinking { display: flex; align-items: center; gap: 12px; color: var(--muted); }
  .dots { display: inline-flex; gap: 5px; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }

  .composer { padding: 14px 36px 22px; border-top: 1px solid var(--line); }
  .composer-box {
    max-width: 820px; display: flex; align-items: flex-end; gap: 10px; padding: 8px 8px 8px 18px;
    border: 1px solid var(--line); border-radius: 13px; background: var(--page);
  }
  .composer-box:focus-within { border-color: var(--ink); }
  .composer textarea {
    flex: 1; min-width: 0; max-height: 160px; padding: 10px 0; border: 0; outline: 0; resize: none;
    background: none; color: var(--text); font: 400 16px/1.5 var(--sans);
  }
  .composer textarea::placeholder { color: var(--muted); }
  .hint { max-width: 820px; margin: 9px 0 0 2px; color: var(--muted); font-size: 12.5px; }

  /* ---------- quiz ---------- */
  .counts { display: inline-flex; gap: 2px; padding: 3px; margin: 28px 0 26px; border: 1px solid var(--line); border-radius: 10px; background: var(--page); }
  .counts button { min-width: 64px; padding: 10px 16px; border: 0; border-radius: 7px; background: none; color: var(--muted); font: 500 15px/1 var(--sans); }
  .counts button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
  .counts-label { display: block; margin-top: 26px; font: 600 14px/1.4 var(--sans); }
  .counts-label + .counts { margin-top: 10px; }
  .bar { height: 3px; margin-bottom: 20px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--ink); }
  .meta { display: flex; justify-content: space-between; margin-bottom: 14px; color: var(--muted); font: 500 13.5px/1.4 var(--sans); }
  .qtext { margin: 0 0 26px; font: 600 clamp(21px, 2.2vw, 26px)/1.3 var(--sans); letter-spacing: -0.02em; overflow-wrap: anywhere; }
  .opts { display: grid; gap: 10px; }
  .opt {
    width: 100%; display: flex; align-items: center; gap: 14px; padding: 14px 16px; text-align: left;
    border: 1px solid var(--line); border-radius: 11px; background: none; font: 400 16px/1.45 var(--sans);
  }
  .opt:hover:not(:disabled) { border-color: var(--ink); background: var(--soft); }
  .key {
    flex: none; width: 30px; height: 30px; display: grid; place-items: center;
    border: 1px solid var(--line); border-radius: 7px; color: var(--muted); font: 600 13px/1 var(--sans);
  }
  .opt.right { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
  .opt.right .key { border-color: currentColor; color: inherit; }
  .opt.wrong { border-style: dashed; border-color: var(--ink); }
  .opt.wrong .txt { text-decoration: line-through; }
  .opt.wrong .key { border-color: var(--ink); color: var(--text); }
  .opt.dim { color: var(--muted); }
  .feedback {
    margin-top: 22px; padding: 20px 22px; border: 1px solid var(--line); border-radius: 12px;
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px; align-items: start;
  }
  .verdict { margin: 0 0 6px; font: 600 17px/1.3 var(--sans); }
  .explain { margin: 0; line-height: 1.65; }
  .fb-page { text-align: right; }
  .fb-page .num { display: block; font: 600 34px/0.95 var(--sans); letter-spacing: -0.03em; }
  .fb-page .lbl { display: block; margin-top: 4px; color: var(--muted); font-size: 12.5px; }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 22px; }
  .actions .hint { margin: 0; }
  .score { margin: 6px 0 8px; font: 600 clamp(60px, 7vw, 88px)/1 var(--sans); letter-spacing: -0.05em; }
  .review { list-style: none; margin: 30px 0 0; padding: 0; border-top: 1px solid var(--line); }
  .review li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .review .mark { font-weight: 600; }
  .review .rq { margin: 0 0 3px; font-weight: 500; }
  .review .ra { margin: 0; color: var(--muted); font-size: 14.5px; }
  .skel { height: 14px; margin: 14px 0; border-radius: 5px; background: var(--soft); }
  .skel.w1 { width: 72%; } .skel.w2 { width: 90%; } .skel.w3 { width: 55%; }

  /* ---------- add a PDF ---------- */
  .drop {
    max-width: 820px; padding: 60px 32px; text-align: center;
    border: 1.5px dashed var(--muted); border-radius: 16px;
  }
  .drop.over { border-color: var(--ink); background: var(--soft); }
  .drop-icon { width: 54px; height: 54px; margin: 0 auto 20px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 14px; }
  .drop h2 { margin: 0 0 10px; font: 600 clamp(26px, 2.6vw, 32px)/1.2 var(--sans); letter-spacing: -0.03em; }
  .drop .lead { margin: 0 auto; }
  .drop .btn { margin-top: 26px; }
  .status { min-height: 1.5em; margin: 18px 0 0; color: var(--muted); font-size: 15px; }
  .loader { width: 220px; height: 3px; margin: 18px auto 0; border-radius: 3px; background: var(--line); overflow: hidden; }
  .loader i { display: block; width: 40%; height: 100%; background: var(--ink); }

  /* ---------- side guide ---------- */
  .rail { min-height: 0; overflow-y: auto; padding: 30px 28px; border-left: 1px solid var(--line); }
  .rail h3 { margin: 0 0 16px; font: 500 13px/1.4 var(--sans); color: var(--muted); }
  .rail-sec + .rail-sec { margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--line); }
  .rail-doc { margin: 0 0 6px; font: 600 17px/1.3 var(--sans); letter-spacing: -0.01em; overflow-wrap: anywhere; }
  .rail-sub { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.55; }
  .tips { list-style: none; margin: 0; padding: 0; }
  .tips li { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 14px; align-items: start; margin-bottom: 18px; color: var(--muted); font-size: 14px; line-height: 1.55; }
  .tips li:last-child { margin-bottom: 0; }
  .tips b { color: var(--text); font-weight: 600; }
  .glyph { width: 44px; height: 44px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 10px; color: var(--text); }
  .glyph.num { font: 600 17px/1 var(--sans); letter-spacing: -0.03em; }

  .loading { padding: 40px 36px; color: var(--muted); }

  /* ---------- motion, only in answer to an action ---------- */
  @media (prefers-reduced-motion: no-preference) {
    .dots i { animation: blink 1.2s infinite ease-in-out; }
    .dots i:nth-child(2) { animation-delay: .15s; }
    .dots i:nth-child(3) { animation-delay: .3s; }
    .skel { animation: pulse 1.4s infinite ease-in-out; }
    .loader i { animation: slide 1.1s infinite ease-in-out; }
    .bar i { transition: width .3s ease; }
    .turn.fresh { animation: rise .25s ease-out; }
    .tab, .opt, .btn, .modes button, .counts button { transition: background-color .12s, border-color .12s, color .12s; }
  }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  @keyframes pulse { 50% { opacity: .45; } }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* ---------- smaller screens ---------- */
  @media (max-width: 1100px) {
    .sheet { grid-template-columns: minmax(0, 1fr); }
    .rail { display: none; }
  }
  @media (max-width: 640px) {
    .top { padding: 14px 16px 0; }
    .brand { font-size: 30px; }
    .tabs { padding: 16px 12px 0; }
    .tab { height: 44px; max-width: 220px; }
    .tab-label { padding: 0 14px; font-size: 14px; }
    .sheet { margin: 0; border-radius: 0; border-left: 0; border-right: 0; border-bottom: 0; }
    .head { padding: 16px; }
    .title { font-size: 20px; }
    .scroll { padding: 24px 16px 14px; }
    .composer { padding: 12px 16px 16px; }
    .composer .hint { display: none; }
    .a { grid-template-columns: minmax(0, 1fr); gap: 4px; }
    .page { display: flex; align-items: baseline; gap: 8px; min-height: 0; border-top-width: 1px; }
    .page .num { font-size: 30px; }
    .page .lbl { margin: 0; }
    .feedback { grid-template-columns: minmax(0, 1fr); }
    .fb-page { text-align: left; }
    .drop { padding: 40px 20px; }
  }
</style>
</head>
<body>
<header class="top">
  <h1 class="brand">ContextIQ</h1>
  <button id="theme" class="icon-btn" type="button" aria-label="Switch between light and dark"></button>
</header>
<nav id="tabs" class="tabs" role="tablist" aria-label="Documents"></nav>
<section id="sheet" class="sheet"><p class="loading">Loading documents…</p></section>

<script>
  const ADD = "__add__";
  const UP = "up:";              // tab ids for uploads look like "up:<document name>"
  const MAX_UPLOADS = 3;
  const MAX_MB = 10;
  const STORE = "contextiq.uploads";
  const THEME = "contextiq.theme";
  const state = { docs: [], tab: null, mode: {}, chats: {}, quiz: {}, uploads: [], sessionId: null };
  let keyHandler = null;   // keyboard shortcuts for the quiz screen that is open
  const $ = (id) => document.getElementById(id);

  // ---------- small helpers ----------
  function el(tag, props = {}, ...kids) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(props)) {
      if (value == null || value === false) continue;
      if (key === "class") node.className = value;
      else if (key === "text") node.textContent = value;
      else if (key === "html") node.innerHTML = value;          // only used with trusted icon strings
      else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
      else node.setAttribute(key, value === true ? "" : value);
    }
    for (const kid of kids.flat()) if (kid != null) node.append(kid);
    return node;
  }

  const ICONS = {
    sun: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>',
    moon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>',
    close: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    plus: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    upload: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 17v-6M9.5 13.5 12 11l2.5 2.5"/></svg>',
    doc: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>',
    quiz: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5l1.6 1.6L8.5 5M4 15.5l1.6 1.6L8.5 14M11.5 7h8.5M11.5 16h8.5"/></svg>',
    clock: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
    chat: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>',
  };
  const icon = (name) => el("span", { "aria-hidden": "true", html: ICONS[name] });

  async function api(path, options) {
    const res = await fetch(path, options);
    let data = null;
    try { data = await res.json(); } catch (e) { /* no JSON body */ }
    if (!res.ok) {
      throw new Error(data && typeof data.detail === "string" ? data.detail : "Something went wrong (error " + res.status + "). Please try again.");
    }
    return data;
  }
  const postJson = (path, body) =>
    api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });

  // Escape HTML first, then allow **bold** and "* " bullets, so model text is always safe to show.
  function format(text) {
    const safe = String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    return safe
      .replace(/^#{1,6}[ \t]+/gm, "")
      .replace(/^[ \t]*[*-][ \t]+/gm, "• ")
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  }
  const pretty = (name) => String(name).replace(/\.pdf$/i, "").replace(/_+/g, " ").trim();
  const typing = (e) => /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  document.addEventListener("keydown", (e) => { if (keyHandler) keyHandler(e); });

  function uniquePages(sources) {
    const pages = [];
    for (const s of sources || []) if (s.page != null && !pages.includes(s.page)) pages.push(s.page);
    return pages;
  }

  // ---------- theme ----------
  function currentTheme() {
    return document.documentElement.dataset.theme ||
      (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  }
  function paintThemeButton() {
    const dark = currentTheme() === "dark";
    const btn = $("theme");
    btn.replaceChildren(icon(dark ? "sun" : "moon"));
    btn.title = dark ? "Switch to light" : "Switch to dark";
  }
  $("theme").addEventListener("click", () => {
    const next = currentTheme() === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem(THEME, next); } catch (e) { /* storage blocked */ }
    paintThemeButton();
  });
  try { const saved = localStorage.getItem(THEME); if (saved) document.documentElement.dataset.theme = saved; } catch (e) { /* ignore */ }
  paintThemeButton();

  // ---------- which document is open ----------
  const findUpload = (id) => state.uploads.find((u) => UP + u.document === id);
  function scope() {
    if (state.tab === ADD) return null;
    const up = findUpload(state.tab);
    if (up) return { key: state.tab, document: up.document, sessionId: state.sessionId, uploaded: true, upload: up };
    return { key: state.tab, document: state.tab, sessionId: null, uploaded: false };
  }
  const showing = (key, mode) => {
    const sc = scope();
    return sc && sc.key === key && (state.mode[key] || "ask") === mode;
  };

  // ---------- uploaded PDFs (kept for this browser tab only) ----------
  function saveUploads() {
    try {
      if (state.uploads.length) sessionStorage.setItem(STORE, JSON.stringify({ uploads: state.uploads, sessionId: state.sessionId }));
      else sessionStorage.removeItem(STORE);
    } catch (e) { /* storage unavailable */ }
  }
  function loadUploads() {
    try {
      const saved = JSON.parse(sessionStorage.getItem(STORE) || "null");
      if (!saved) return;
      // the server deletes an upload one hour after it was added, so drop ours a little earlier
      state.uploads = (saved.uploads || []).filter((u) => Date.now() - u.savedAt < 55 * 60 * 1000);
      state.sessionId = state.uploads.length ? saved.sessionId : null;
      saveUploads();
    } catch (e) { /* ignore */ }
  }
  function forgetTab(key) { delete state.mode[key]; delete state.chats[key]; delete state.quiz[key]; }

  function openTab(id) { state.tab = id; render(); }
  function render() { renderTabs(); renderSheet(); }

  // ---------- tabs ----------
  function renderTabs() {
    const nav = $("tabs");
    nav.replaceChildren();
    const tab = ({ id, label, extra = "", close = null, locked = false, content }) => el("div", {
      class: "tab" + extra + (state.tab === id ? " active" : "") + (close ? " closable" : "") + (locked ? " locked" : ""),
      role: "presentation",
    },
      el("button", {
        class: "tab-label", type: "button", role: "tab", title: locked ? "You can have " + MAX_UPLOADS + " PDFs at a time. Remove one to add another." : label,
        "aria-selected": String(state.tab === id), "aria-disabled": locked ? "true" : null,
        onclick: () => { if (!locked) openTab(id); },
      }, content || label),
      close);
    for (const name of state.docs) nav.append(tab({ id: name, label: pretty(name) }));
    for (const up of state.uploads) {
      const name = pretty(up.document);
      nav.append(tab({
        id: UP + up.document, label: name,
        close: el("button", { class: "tab-close", type: "button", title: "Remove this PDF", "aria-label": "Remove " + name, onclick: () => removeUpload(up.document) }, icon("close")),
      }));
    }
    nav.append(tab({ id: ADD, label: "Add a PDF", extra: " add", locked: state.uploads.length >= MAX_UPLOADS, content: [icon("plus"), "Add a PDF"] }));
  }

  // ---------- the sheet ----------
  function renderSheet() {
    keyHandler = null;
    const sheet = $("sheet");
    const sc = scope();
    if (!sc) {
      sheet.replaceChildren(
        el("div", { class: "main" },
          el("div", { class: "head" }, el("h2", { class: "title", text: "Add a PDF" })),
          el("div", { class: "scroll" }, uploaderView())),
        uploadRail());
      return;
    }
    const mode = state.mode[sc.key] || "ask";
    const modes = el("div", { class: "modes", role: "group", "aria-label": "What do you want to do" },
      [["ask", "Ask questions", "chat"], ["quiz", "Take a quiz", "quiz"]].map(([m, label, ic]) => el("button", {
        type: "button", "aria-pressed": String(mode === m),
        onclick: () => { state.mode[sc.key] = m; renderSheet(); },
      }, icon(ic), label)));
    const head = el("div", { class: "head" }, el("h2", { class: "title", text: pretty(sc.document) }), modes);
    sheet.replaceChildren(
      el("div", { class: "main" }, head, ...(mode === "ask" ? askView(sc) : quizView(sc))),
      docRail(sc));
  }

  // ---------- side guide ----------
  function docRail(sc) {
    const sub = sc.uploaded
      ? "Your upload" + (sc.upload.chunks ? ", split into " + sc.upload.chunks + " searchable passages" : "") + ". It is removed automatically one hour after you added it."
      : "Built-in document. Anyone using ContextIQ can ask about it.";
    return el("aside", { class: "rail", "aria-label": "How ContextIQ works" },
      el("div", { class: "rail-sec" }, el("p", { class: "rail-doc", text: pretty(sc.document) }), el("p", { class: "rail-sub", text: sub })),
      el("div", { class: "rail-sec" },
        el("h3", { text: "How it works" }),
        el("ul", { class: "tips" },
          el("li", {}, el("span", { class: "glyph num", text: "11" }),
            el("span", {}, el("b", { text: "The big number is the page." }), " Every answer shows where in the document it came from, so you can check it.")),
          el("li", {}, el("span", { class: "glyph" }, icon("doc")),
            el("span", {}, el("b", { text: "Only this document." }), " If the answer is not in it, ContextIQ tells you instead of guessing.")),
          el("li", {}, el("span", { class: "glyph" }, icon("quiz")),
            el("span", {}, el("b", { text: "Test yourself." }), " Switch to Take a quiz for multiple-choice questions written from the text.")))),
      el("div", { class: "rail-sec" },
        el("h3", { text: "Good to know" }),
        el("p", { class: "rail-sub", text: "Sign-in is not built yet, so chat history is not saved. Your conversation stays while this page is open and clears when you reload it." })));
  }
  function uploadRail() {
    return el("aside", { class: "rail", "aria-label": "About uploads" },
      el("div", { class: "rail-sec" },
        el("h3", { text: "Before you upload" }),
        el("ul", { class: "tips" },
          el("li", {}, el("span", { class: "glyph" }, icon("doc")),
            el("span", {}, el("b", { text: "Text PDFs work best." }), " Scanned pages that are only pictures cannot be read.")),
          el("li", {}, el("span", { class: "glyph" }, icon("clock")),
            el("span", {}, el("b", { text: "Private and temporary." }), " Only this browser tab can ask about it, and each PDF is deleted one hour after you add it.")),
          el("li", {}, el("span", { class: "glyph num", text: String(MAX_UPLOADS) }),
            el("span", {}, el("b", { text: "Up to " + MAX_UPLOADS + " at a time." }), " Each PDF can be up to " + MAX_MB + " MB and gets its own tab.")),
          el("li", {}, el("span", { class: "glyph" }, icon("quiz")),
            el("span", {}, el("b", { text: "Ask or quiz." }), " Once it is read, it opens in its own tab like the built-in documents.")))));
  }

  // ---------- ask ----------
  function askView(sc) {
    const history = state.chats[sc.key] || (state.chats[sc.key] = []);
    const col = el("div", { class: "col" });
    const scroll = el("div", { class: "scroll" }, col);
    const box = el("textarea", { rows: "1", placeholder: "Ask anything about " + pretty(sc.document), "aria-label": "Your question" });
    const send = el("button", { class: "btn", type: "submit" }, "Ask");
    const form = el("form", { class: "composer", onsubmit: (e) => { e.preventDefault(); submit(box.value); } },
      el("div", { class: "composer-box" }, box, send),
      el("p", { class: "hint", text: "Press Enter to ask. Chats are not saved yet because there is no sign-in, so this conversation clears when you reload." }));

    const grow = () => { box.style.height = "auto"; box.style.height = Math.min(box.scrollHeight, 160) + "px"; };
    box.addEventListener("input", grow);
    box.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); }
    });

    function draw(fresh) {
      col.replaceChildren();
      if (!history.length) {
        col.append(el("div", { class: "welcome" },
          el("h2", { text: "What would you like to know?" }),
          el("p", { class: "lead", text: "Type your question below. Every answer comes from " + pretty(sc.document) + " and shows the page it is on." })));
      }
      history.forEach((t, i) => col.append(turnNode(t, fresh && i === history.length - 1)));
      scroll.scrollTop = scroll.scrollHeight;
    }

    async function submit(text) {
      const question = text.trim();
      if (!question || send.disabled) return;
      box.value = ""; grow();
      const turn = { q: question, pending: true };
      history.push(turn);
      draw(true);
      send.disabled = true;
      try {
        const data = await postJson("/chat", { question, session_id: sc.sessionId, document: sc.document });
        turn.answer = data.answer; turn.sources = data.sources || [];
      } catch (err) {
        turn.error = err.message;
      }
      turn.pending = false;
      send.disabled = false;
      if (col.isConnected) { draw(false); box.focus(); }
      else if (showing(sc.key, "ask")) renderSheet();
    }

    draw(false);
    setTimeout(() => { if (box.isConnected && matchMedia("(min-width: 641px)").matches) box.focus(); }, 0);
    return [scroll, form];
  }

  function turnNode(t, fresh) {
    const page = el("div", { class: "page" });
    const body = el("div", { class: "a-body" });
    const extra = [];
    if (t.pending) {
      page.classList.add("none");
      body.append(el("div", { class: "thinking", role: "status" },
        el("span", { class: "dots", "aria-hidden": "true" }, el("i"), el("i"), el("i")), "Reading the document"));
    } else if (t.error) {
      page.classList.add("none");
      body.classList.add("err");
      body.textContent = t.error;
    } else {
      const pages = uniquePages(t.sources);
      if (pages.length) {
        page.append(el("span", { class: "num", text: String(pages[0]) }), el("span", { class: "lbl", text: "page" }));
        if (pages.length > 1) page.append(el("span", { class: "lbl", text: "also " + pages.slice(1, 4).join(", ") }));
      } else {
        page.classList.add("none");
      }
      body.innerHTML = format(t.answer);
      const copy = el("button", { class: "text-btn", type: "button", text: "Copy answer" });
      copy.addEventListener("click", async () => {
        try { await navigator.clipboard.writeText(t.answer); copy.textContent = "Copied"; }
        catch (e) { copy.textContent = "Could not copy"; }
        setTimeout(() => { copy.textContent = "Copy answer"; }, 1500);
      });
      extra.push(el("div", { class: "a-tools" }, copy));
    }
    return el("article", { class: "turn" + (fresh ? " fresh" : "") },
      el("h3", { class: "q", text: t.q }),
      el("div", { class: "a" }, page, el("div", {}, body, extra)));
  }

  // ---------- quiz ----------
  function quizView(sc) {
    const q = state.quiz[sc.key] || (state.quiz[sc.key] = { phase: "start", count: 5 });
    const col = el("div", { class: "col" });
    const scroll = el("div", { class: "scroll" }, col);
    const redraw = () => {
      if (col.isConnected || !col.dataset.drawn) { col.dataset.drawn = "1"; col.replaceChildren(quizBody(sc, q, redraw)); scroll.scrollTop = 0; }
      else if (showing(sc.key, "quiz")) renderSheet();
    };
    redraw();
    return [scroll];
  }

  async function startQuiz(sc, q, redraw) {
    q.phase = "loading"; redraw();
    try {
      const data = await postJson("/quiz", { document: sc.document, session_id: sc.sessionId, count: q.count });
      if (!data.questions || !data.questions.length) throw new Error("No questions came back. Please try again.");
      Object.assign(q, { questions: data.questions, index: 0, score: 0, picked: null, log: [], phase: "question" });
    } catch (err) {
      q.error = err.message; q.phase = "error";
    }
    redraw();
  }

  function quizBody(sc, q, redraw) {
    keyHandler = null;
    const name = pretty(sc.document);

    if (q.phase === "start") {
      return el("div", {},
        el("h2", { class: "display", text: "Quiz yourself on " + name }),
        el("p", { class: "lead", text: "Multiple-choice questions are written from the document. Each answer shows the page to read." }),
        el("span", { class: "counts-label", id: "count-label", text: "How many questions?" }),
        el("div", { class: "counts", role: "group", "aria-labelledby": "count-label" },
          [3, 5, 10].map((n) => el("button", {
            type: "button", text: String(n), "aria-pressed": String(q.count === n),
            onclick: () => { q.count = n; redraw(); },
          }))),
        el("div", {}, el("button", { class: "btn", type: "button", text: "Start quiz", onclick: () => startQuiz(sc, q, redraw) })));
    }

    if (q.phase === "loading") {
      return el("div", { role: "status" },
        el("p", { class: "meta", text: "Writing " + q.count + " questions from " + name + ". This takes a few seconds." }),
        el("div", { class: "skel w1" }), el("div", { class: "skel w2" }), el("div", { class: "skel w3" }),
        el("div", { class: "skel w2" }), el("div", { class: "skel w1" }));
    }

    if (q.phase === "error") {
      return el("div", { role: "alert" },
        el("h2", { class: "display", text: "The quiz could not be written" }),
        el("p", { class: "lead", text: q.error }),
        el("div", { class: "actions" },
          el("button", { class: "btn", type: "button", text: "Try again", onclick: () => startQuiz(sc, q, redraw) }),
          el("button", { class: "btn ghost", type: "button", text: "Back", onclick: () => { q.phase = "start"; redraw(); } })));
    }

    const letters = ["A", "B", "C", "D"];

    if (q.phase === "result") {
      const total = q.questions.length;
      const note = q.score === total ? "Full marks. You know this document well."
        : q.score / total >= 0.6 ? "Good work. Check the pages for the ones you missed."
        : "Worth another read. The pages for each answer are listed below.";
      return el("div", {},
        el("p", { class: "meta", text: "Your result" }),
        el("p", { class: "score", text: q.score + " / " + total }),
        el("p", { class: "lead", text: note }),
        el("div", { class: "actions" },
          el("button", { class: "btn", type: "button", text: "New quiz", onclick: () => { q.phase = "start"; redraw(); } }),
          el("button", { class: "btn ghost", type: "button", text: "Ask a question instead", onclick: () => { state.mode[sc.key] = "ask"; renderSheet(); } })),
        el("ol", { class: "review", "aria-label": "Review" }, q.questions.map((item, i) => {
          const picked = q.log[i] ? q.log[i].picked : null;
          const right = picked === item.answer_index;
          return el("li", {},
            el("span", { class: "mark", "aria-label": right ? "Correct" : "Wrong", text: right ? "✓" : "✕" }),
            el("div", {},
              el("p", { class: "rq", text: item.question }),
              el("p", { class: "ra", text: "Answer " + letters[item.answer_index] + ": " + item.options[item.answer_index] + (item.page ? ". Page " + item.page : "") })));
        })));
    }

    // phase === "question"
    const item = q.questions[q.index];
    const total = q.questions.length;
    const answered = q.picked !== null;
    const last = q.index + 1 >= total;
    const pick = (i) => {
      if (q.picked !== null) return;
      q.picked = i; q.log[q.index] = { picked: i };
      if (i === item.answer_index) q.score++;
      redraw();
    };
    const next = () => {
      if (last) q.phase = "result"; else { q.index++; q.picked = null; }
      redraw();
    };
    keyHandler = (e) => {
      if (typing(e) || e.target.tagName === "BUTTON" || e.metaKey || e.ctrlKey || e.altKey) return;
      const k = e.key.toLowerCase();
      let idx = "1234".indexOf(k);
      if (idx < 0) idx = "abcd".indexOf(k);
      if (!answered && idx >= 0 && idx < item.options.length) { e.preventDefault(); pick(idx); }
      else if (answered && e.key === "Enter") { e.preventDefault(); next(); }
    };

    const options = item.options.map((text, i) => {
      let cls = "opt";
      let mark = letters[i];
      if (answered) {
        if (i === item.answer_index) { cls += " right"; mark = "✓"; }
        else if (i === q.picked) { cls += " wrong"; mark = "✕"; }
        else cls += " dim";
      }
      return el("button", { class: cls, type: "button", disabled: answered, onclick: () => pick(i) },
        el("span", { class: "key", "aria-hidden": "true", text: mark }), el("span", { class: "txt", text }));
    });

    const parts = [
      el("div", { class: "bar", role: "progressbar", "aria-valuemin": "0", "aria-valuemax": String(total), "aria-valuenow": String(q.index + (answered ? 1 : 0)) },
        el("i", { style: "width:" + ((q.index + (answered ? 1 : 0)) / total * 100) + "%" })),
      el("div", { class: "meta" }, el("span", { text: "Question " + (q.index + 1) + " of " + total }), el("span", { text: q.score + " correct" })),
      el("h2", { class: "qtext", text: item.question }),
      el("div", { class: "opts", role: "group", "aria-label": "Answers" }, options),
    ];

    if (!answered) {
      parts.push(el("p", { class: "hint", style: "margin-top:16px", text: "Tip: press 1 to 4 to choose." }));
    } else {
      const right = q.picked === item.answer_index;
      const nextBtn = el("button", { class: "btn", type: "button", text: last ? "See my result" : "Next question", onclick: next });
      parts.push(
        el("div", { class: "feedback", role: "status" },
          el("div", {},
            el("p", { class: "verdict", text: right ? "Correct." : "Not quite. The answer is " + letters[item.answer_index] + "." }),
            item.explanation ? el("p", { class: "explain", text: item.explanation }) : null),
          item.page ? el("div", { class: "fb-page" }, el("span", { class: "num", text: String(item.page) }), el("span", { class: "lbl", text: "page" })) : null),
        el("div", { class: "actions" }, nextBtn, el("p", { class: "hint", text: "or press Enter" })));
      setTimeout(() => { if (nextBtn.isConnected) { nextBtn.focus({ preventScroll: true }); nextBtn.scrollIntoView({ block: "nearest" }); } }, 0);
    }
    return el("div", {}, parts);
  }

  // ---------- add a PDF ----------
  function uploaderView() {
    const input = el("input", { type: "file", accept: "application/pdf,.pdf", hidden: true });
    const status = el("p", { class: "status", role: "status" });
    const choose = el("button", { class: "btn", type: "button", onclick: () => input.click() }, "Choose a PDF");
    const drop = el("div", { class: "drop" },
      el("div", { class: "drop-icon" }, icon("upload")),
      el("h2", { text: "Drop your PDF here" }),
      el("p", { class: "lead", text: "Or choose a file from your computer. Once it is read, you can ask questions about it or take a quiz." }),
      choose, status, input);
    const handle = (file) => uploadFile(file, { drop, status, choose });
    input.addEventListener("change", () => { if (input.files[0]) handle(input.files[0]); });
    drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
    drop.addEventListener("dragleave", () => drop.classList.remove("over"));
    drop.addEventListener("drop", (e) => {
      e.preventDefault(); drop.classList.remove("over");
      if (e.dataTransfer.files[0]) handle(e.dataTransfer.files[0]);
    });
    return drop;
  }

  async function uploadFile(file, ui) {
    if (!/\.pdf$/i.test(file.name)) { ui.status.textContent = "That file is not a PDF. Choose a file that ends in .pdf."; return; }
    if (file.size > MAX_MB * 1024 * 1024) { ui.status.textContent = "That PDF is larger than " + MAX_MB + " MB. Choose a smaller file."; return; }
    ui.choose.disabled = true;
    ui.status.textContent = "Reading " + file.name + ". This takes a few seconds.";
    const loader = el("div", { class: "loader", "aria-hidden": "true" }, el("i"));
    ui.status.after(loader);
    const body = new FormData();
    body.append("file", file);
    const url = "/upload" + (state.sessionId ? "?session_id=" + encodeURIComponent(state.sessionId) : "");
    try {
      const data = await api(url, { method: "POST", body });
      const up = { document: data.document, chunks: data.chunks, savedAt: Date.now() };
      state.uploads = state.uploads.filter((u) => u.document !== up.document).concat(up);
      state.sessionId = data.session_id;
      forgetTab(UP + up.document);
      saveUploads();
      openTab(UP + up.document);
    } catch (err) {
      loader.remove();
      ui.choose.disabled = false;
      ui.status.textContent = "Upload failed. " + err.message;
    }
  }

  async function removeUpload(documentName) {
    const key = UP + documentName;
    const sessionId = state.sessionId;
    state.uploads = state.uploads.filter((u) => u.document !== documentName);
    forgetTab(key);
    if (!state.uploads.length) state.sessionId = null;
    saveUploads();
    if (state.tab === key) {
      const last = state.uploads[state.uploads.length - 1];
      state.tab = last ? UP + last.document : (state.docs[0] || ADD);
    }
    render();
    if (sessionId) {
      try {
        await fetch("/session/" + encodeURIComponent(sessionId) + "/documents/" + encodeURIComponent(documentName), { method: "DELETE" });
      } catch (e) { /* it expires on its own */ }
    }
  }

  // ---------- start ----------
  async function init() {
    loadUploads();
    try { state.docs = (await api("/documents")).documents || []; } catch (e) { state.docs = []; }
    state.tab = state.docs[0] || (state.uploads.length ? UP + state.uploads[0].document : ADD);
    render();
  }
  init();
</script>
</body>
</html>
